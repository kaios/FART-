<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digestion Lab</title>
<style>
:root{
  --bg:#0b0f17; --panel:#111726; --panel-2:#172036; --line:#26314b; --ink:#e6ecf7; --muted:#7f8ba6;
  --wire:#8fd3ff; --blue:#3fb4ff; --green:#5dff7a; --yellow:#ffd84a; --red:#ff5d6c;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[lang="ja"]{
  --font: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%}
#app.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-3px,1px)} 20%,80%{transform:translate(6px,-2px)}
  30%,50%,70%{transform:translate(-10px,3px)} 40%,60%{transform:translate(10px,-3px)}
}

header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.1em;font-size:15px;white-space:nowrap}
.brand span{color:var(--green);margin-left:.4em}
.stats{display:flex;gap:20px;margin-left:auto;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat small{font-size:10px;color:var(--muted);letter-spacing:.14em}
.stat b{font-size:18px}
.controls{display:flex;gap:10px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:.08em}
.chip:hover{border-color:var(--wire)}

.switch{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;font-size:12px;font-weight:700}
.switch .opt{color:var(--muted);transition:color .2s}
.switch[aria-checked="false"] .en,.switch[aria-checked="true"] .ja{color:var(--ink)}
.track{width:40px;height:22px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);position:relative}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--wire);transition:transform .2s}
.switch[aria-checked="true"] .knob{transform:translateX(18px);background:var(--red)}

main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:0 0 70%;position:relative;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;top:12px;left:16px;font-size:12px;letter-spacing:.12em;color:var(--muted);pointer-events:none}

#predict{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(520px,calc(100% - 32px));
  background:rgba(17,23,38,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center}
#predict[hidden]{display:none}
.ptitle{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--yellow)}
.pbar{height:4px;background:var(--panel-2);border-radius:4px;margin:8px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--yellow);transform-origin:left}
.pbtns{display:flex;gap:8px}
.pbtns button{flex:1;padding:10px 6px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);
  font-weight:900;letter-spacing:.06em;font-size:15px;transition:transform .08s,border-color .15s,background .15s}
.pbtns button:hover:not(:disabled){transform:translateY(-1px)}
.pbtns [data-choice="burp"]{color:var(--blue)} .pbtns [data-choice="burp"]:hover:not(:disabled){border-color:var(--blue)}
.pbtns [data-choice="fart"]{color:var(--green)} .pbtns [data-choice="fart"]:hover:not(:disabled){border-color:var(--green)}
.pbtns [data-choice="smooth"]{color:var(--yellow)} .pbtns [data-choice="smooth"]:hover:not(:disabled){border-color:var(--yellow)}
.pbtns button.picked{background:#22304d;border-color:currentColor}
.pbtns button:disabled:not(.picked){opacity:.35}
.presult{min-height:1.4em;margin-top:8px;font-weight:900;letter-spacing:.08em}
.presult.ok{color:var(--green)} .presult.bad{color:var(--red)}

#menu{flex:0 0 30%;border-left:1px solid var(--line);background:var(--panel);padding:20px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0}
.mhead{border-bottom:1px dashed var(--line);padding-bottom:12px}
.mhead h2{margin:0;font-size:20px;letter-spacing:.2em;font-weight:900}
.mhead p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.foods{display:flex;flex-direction:column;gap:8px}
.food{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);transition:border-color .15s,transform .08s}
.food:hover:not(:disabled){border-color:var(--wire);transform:translateX(-2px)}
.food:disabled{opacity:.4}
.food svg{width:28px;height:28px;flex:none;stroke:var(--wire);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.food .nm{flex:1;font-size:15px;font-weight:600}
.food kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.mfoot{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.6}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,15,23,.82);padding:16px;z-index:5}
#overlay[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 28px 24px;max-width:440px;width:100%;text-align:center}
.logo{font-size:34px;font-weight:900;letter-spacing:.12em;line-height:1.1}
.logo span{display:block;color:var(--green);font-size:22px;letter-spacing:.5em;margin-top:4px}
.card p{color:var(--muted);line-height:1.6;margin:8px 0}
.card .big-score{font-size:56px;font-weight:900;color:var(--yellow);margin:8px 0 0;font-variant-numeric:tabular-nums}
.card .rank{color:var(--ink);font-weight:700;font-size:18px}
.big{margin-top:18px;padding:14px 34px;font-size:18px;font-weight:900;letter-spacing:.14em;border-radius:12px;
  background:var(--green);color:#06210f;border:0;box-shadow:0 0 24px rgba(93,255,122,.35)}
.big:hover{filter:brightness(1.08)}
.dots{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.dots i{width:10px;height:10px;border-radius:50%}

@media (max-width:760px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{flex-direction:column}
  #stage{flex:none;height:64vh;min-height:420px}
  #menu{flex:none;border-left:0;border-top:1px solid var(--line)}
  .foods{display:grid;grid-template-columns:1fr 1fr}
  .stats{gap:12px}
  .pbtns button{font-size:13px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" data-i18n="title">DIGESTION LAB</div>
    <div class="stats">
      <div class="stat"><small data-i18n="score">SCORE</small><b id="hScore">0</b></div>
      <div class="stat"><small data-i18n="round">ROUND</small><b id="hRound">0/8</b></div>
      <div class="stat"><small data-i18n="best">BEST</small><b id="hBest">0</b></div>
    </div>
    <div class="controls">
      <button id="snd" class="chip" type="button"></button>
      <button id="lang" class="switch" type="button" role="switch" aria-checked="false" aria-label="Language / 言語">
        <span class="opt en">EN</span><span class="track"><span class="knob"></span></span><span class="opt ja">日本語</span>
      </button>
    </div>
  </header>

  <main>
    <section id="stage">
      <canvas id="cv"></canvas>
      <div id="status"></div>
      <div id="predict" hidden>
        <div class="ptitle" data-i18n="predict"></div>
        <div class="pbar"><i id="pbarFill"></i></div>
        <div class="pbtns">
          <button type="button" data-choice="burp"></button>
          <button type="button" data-choice="fart"></button>
          <button type="button" data-choice="smooth"></button>
        </div>
        <div id="presult" class="presult"></div>
      </div>
    </section>

    <aside id="menu">
      <div class="mhead">
        <h2 data-i18n="menu">MENU</h2>
        <p data-i18n="menuSub"></p>
      </div>
      <div class="foods" id="foods"></div>
      <div class="mfoot" data-i18n="keys"></div>
    </aside>

    <div id="overlay"><div class="card" id="card"></div></div>
  </main>
</div>

<script>
(() => {
'use strict';

// ---------- i18n ----------
const I18N = {
  en: {
    title: 'DIGESTION LAB', start: 'START GAME', again: 'PLAY AGAIN',
    score: 'SCORE', round: 'ROUND', best: 'BEST', menu: 'MENU',
    menuSub: 'Pick a food, then predict what the body does with it.',
    soda: 'Carbonated Soda', sparkling: 'Sparkling Water', beans: 'Beans',
    broccoli: 'Broccoli', rice: 'White Rice', banana: 'Bananas',
    predict: 'PREDICT BEFORE IT ARRIVES!', burp: '[BURP]', fart: '[FART]', smooth: '[SMOOTH]',
    burpFx: 'BURP!', fartFx: 'FART!', smoothFx: 'SMOOTH RIDE!',
    correct: 'CORRECT! +100', wrong: 'WRONG +0', late: 'TOO LATE +0',
    ready: 'CHOOSE A FOOD FROM THE MENU', digesting: 'DIGESTING',
    eso: 'ESOPHAGUS', stomach: 'STOMACH', small: 'SMALL INTESTINE', large: 'LARGE INTESTINE', express: 'EXPRESS LANE',
    intro1: 'Feed the body and watch the food travel.',
    intro2: 'Predict BURP, FART or SMOOTH before it lands.',
    intro3: '+100 per correct call · 8 rounds',
    results: 'RESULTS', soundOn: 'SOUND ON', soundOff: 'SOUND OFF',
    keys: 'Keys: 1–6 pick food · B / F / S predict',
    ranks: ['Keep chewing on it.', 'Solid gut instinct.', 'Gastro genius!'],
  },
  ja: {
    title: '消化ラボ', start: 'ゲームスタート', again: 'もう一度',
    score: 'スコア', round: 'ラウンド', best: 'ベスト', menu: 'メニュー',
    menuSub: '食べ物を選んで、体の反応を予想しよう。',
    soda: '炭酸ソーダ', sparkling: '炭酸水', beans: '豆',
    broccoli: 'ブロッコリー', rice: '白ごはん', banana: 'バナナ',
    predict: '到着する前に予想しよう！', burp: '[ゲップ]', fart: '[おなら]', smooth: '[スムーズ]',
    burpFx: 'ゲップ！', fartFx: 'ブッ！', smoothFx: 'スムーズライド！',
    correct: '正解！ +100', wrong: 'ハズレ +0', late: '時間切れ +0',
    ready: 'メニューから食べ物を選ぼう', digesting: '消化中',
    eso: '食道', stomach: '胃', small: '小腸', large: '大腸', express: '直通ルート',
    intro1: '食べ物を体に送り、その旅を見守ろう。',
    intro2: '到着する前に「ゲップ」「おなら」「スムーズ」を予想！',
    intro3: '正解ごとに +100 ・ 全8ラウンド',
    results: '結果', soundOn: 'サウンド ON', soundOff: 'サウンド OFF',
    keys: 'キー: 1–6 食べ物 ・ B / F / S 予想',
    ranks: ['もっと噛みしめよう。', 'なかなかの腹の勘。', '胃腸の天才！'],
  },
};
let lang = 'en';
const T = k => I18N[lang][k];

// ---------- data ----------
const FOODS = [
  { id: 'soda',      cat: 'burp',   icon: '<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="7" y1="7" x2="17" y2="7"/><line x1="7" y1="17" x2="17" y2="17"/>' },
  { id: 'beans',     cat: 'fart',   icon: '<ellipse cx="12" cy="12" rx="8" ry="5" transform="rotate(-30 12 12)"/><path d="M8.5 13.5c2.5.8 5-.4 6.5-3"/>' },
  { id: 'rice',      cat: 'smooth', icon: '<path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M7 12c1-3 3-4.5 5-4.5s4 1.5 5 4.5"/>' },
  { id: 'sparkling', cat: 'burp',   icon: '<path d="M6 3h12l-2 18H8z"/><circle cx="11" cy="15" r="1"/><circle cx="13.5" cy="10.5" r="1"/><circle cx="10.5" cy="7.5" r=".6"/>' },
  { id: 'broccoli',  cat: 'fart',   icon: '<circle cx="8" cy="9.5" r="3.5"/><circle cx="16" cy="9.5" r="3.5"/><circle cx="12" cy="6.5" r="3.5"/><path d="M10 13l1 8h2l1-8"/>' },
  { id: 'banana',    cat: 'smooth', icon: '<path d="M5 5c0 8 5 13 15 12-2.5 3.5-11 4.5-14.5-1.5C4 12.5 4 8 5 5z"/><path d="M5 5l-1-1.5"/>' },
];
const ROUNDS = 8, N_PART = 14, STAGGER = 0.07;
const TRAVEL = { burp: 2.2, fart: 2.8, smooth: 2.2 };   // seconds for the lead particle to reach its destination
const TIMEOUT = { burp: 2, fart: 4 };                  // seconds from arrival to the explosion

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { bg: css('--bg'), wire: css('--wire'), muted: css('--muted'), line: css('--line'),
            blue: css('--blue'), green: css('--green'), yellow: css('--yellow'), ink: css('--ink') };
const CAT_COLOR = { burp: C.blue, fart: C.green, smooth: C.yellow };
let FONT = css('--font');

// ---------- geometry (virtual 600 x 820 space) ----------
const VW = 600, VH = 820;
function chaikin(pts, n) {
  for (let k = 0; k < n; k++) {
    const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
    }
    o.push(pts[pts.length - 1]);
    pts = o;
  }
  return pts;
}
function mkPath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const p2 = new Path2D();
  pts.forEach((p, i) => i ? p2.lineTo(p[0], p[1]) : p2.moveTo(p[0], p[1]));
  return { pts, cum, L: cum[cum.length - 1], p2 };
}
function at(p, d) {
  d = Math.max(0, Math.min(p.L, d));
  let i = 1;
  while (i < p.cum.length - 1 && p.cum[i] < d) i++;
  const a = p.pts[i - 1], b = p.pts[i], seg = (p.cum[i] - p.cum[i - 1]) || 1, k = (d - p.cum[i - 1]) / seg;
  return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, a: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}

const BODY = [ // side profile facing right
  [300,186],[281,140],[283,90],[306,55],[345,45],[380,60],[392,90],[393,108],[409,125],[394,132],[396,142],
  [389,147],[396,153],[388,168],[370,178],[355,183],[352,215],[382,250],[410,300],[406,350],[421,420],[426,500],
  [411,560],[386,620],[381,700],[366,800],
];
const BACK = [[300,186],[298,225],[285,250],[278,320],[282,420],[275,520],[260,590],[258,630],[275,665],[285,700],[291,800]];
const ARM = [[330,248],[338,350],[346,452],[388,520]];
const MOUTH = { x: 390, y: 147 }, CHEEK = { x: 378, y: 140 }, ANUS = { x: 266, y: 630 };
const STOM = { x: 315, y: 335, w: 80, h: 60, cx: 355, cy: 365 };

const ESO_RAW = [[390,147],[372,152],[350,170],[334,205],[327,250],[327,290],[334,322],[347,338]];
const P_ESO = mkPath(chaikin(ESO_RAW, 3));
const P_TO_STOM = mkPath(chaikin([...ESO_RAW, [STOM.cx, STOM.cy]], 3));

const SI_RAW = [[375,395],[375,412],[392,424]];
for (let r = 0, y = 432; r < 6; r++, y += 20) r % 2 ? SI_RAW.push([312, y], [392, y]) : SI_RAW.push([392, y], [312, y]);
SI_RAW.push([404, 546]);
const P_SI = mkPath(chaikin(SI_RAW, 2));

const P_COLON = mkPath(chaikin([[402,548],[410,540],[410,425],[402,413],[306,413],[297,422],[297,560],[306,580],[288,602],[ANUS.x,ANUS.y]], 2));
const BYPASS_RAW = [[327,255],[322,285],[306,315],[296,350],[294,390],[297,428]];
const P_BYPASS = mkPath(chaikin(BYPASS_RAW, 3));
const P_BEANS = mkPath(chaikin([[390,147],[372,152],[350,170],[334,205],[327,250],[322,285],[306,315],[296,350],[294,390],[297,430],[297,560],[306,580],[290,600]], 3));

// ---------- canvas ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = Math.min(r.width / VW, r.height / VH);
  offX = (r.width - VW * scale) / 2; offY = (r.height - VH * scale) / 2;
}
new ResizeObserver(resize).observe(cv);

// ---------- audio (all synthesized) ----------
let AC = null, master = null, muted = false;
function audio() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor(); master = AC.createGain(); master.gain.value = muted ? 0 : .6; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(a, sec) {
  const b = a.createBuffer(1, Math.ceil(a.sampleRate * sec), a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = b; return s;
}
function env(a, t, peak, atk, hold, rel) {
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + atk);
  g.gain.setValueAtTime(peak, t + atk + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + atk + hold + rel);
  return g;
}
function lfo(a, t, freq, depth, target, dur) {
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(target);
  o.start(t); o.stop(t + dur);
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = env(a, t, vol, .01, dur * .3, dur * .7);
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  click: () => tone('square', 660, 520, .06, .08),
  gulp:  () => { tone('sine', 320, 110, .22, .35); tone('sine', 260, 90, .18, .25, .16); },
  ok:    () => { tone('triangle', 660, 660, .1, .25); tone('triangle', 990, 990, .16, .25, .09); },
  bad:   () => { tone('sawtooth', 220, 140, .25, .12); },
  fizz() {
    const a = audio(); if (!a) return;
    const t = a.currentTime, n = noise(a, 2), f = a.createBiquadFilter(), g = env(a, t, .07, .3, 1.2, .5);
    f.type = 'highpass'; f.frequency.value = 5000;
    lfo(a, t, 23, .05, g.gain, 2);
    n.connect(f).connect(g).connect(master); n.start(t);
  },
  burp() {
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), f = a.createBiquadFilter(), g = env(a, t, .55, .03, .45, .3);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(115, t); o.frequency.linearRampToValueAtTime(82, t + .4); o.frequency.linearRampToValueAtTime(58, t + .75);
    lfo(a, t, 31, 22, o.frequency, .8);
    lfo(a, t, 13, .22, g.gain, .8);
    f.type = 'lowpass'; f.frequency.value = 650; f.Q.value = 7;
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + .85);
  },
  fart() {
    const a = audio(); if (!a) return;
    const t = a.currentTime, dur = 1.15, o = a.createOscillator(), f = a.createBiquadFilter(), g = env(a, t, .6, .02, .75, .38);
    const curve = new Float32Array(24);
    for (let i = 0; i < curve.length; i++) curve[i] = 95 - i * 1.6 + (Math.random() - .5) * 30;
    o.type = 'sawtooth'; o.frequency.setValueCurveAtTime(curve, t, dur);
    lfo(a, t, 27, .35, g.gain, dur);
    f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 4;
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
    const n = noise(a, dur), nf = a.createBiquadFilter(), ng = env(a, t, .25, .02, .6, .5);
    nf.type = 'bandpass'; nf.frequency.value = 180; nf.Q.value = 1.2;
    n.connect(nf).connect(ng).connect(master); n.start(t);
  },
  rumble() {
    const a = audio(); if (!a) return;

// ---------- state ----------
let state = 'title', score = 0, round = 0, best = 0, run = null;
let bubbles = [], puffs = [], fx = [], shakeT = 0, shakeDur = 1, shakeAmp = 0;
try { best = +localStorage.getItem('digestionLab.best') || 0; } catch (e) {}
try { if (localStorage.getItem('digestionLab.lang') === 'ja') lang = 'ja'; } catch (e) {}

const $ = id => document.getElementById(id);
const app = $('app'), foodsEl = $('foods'), predictEl = $('predict'), presult = $('presult'), pbar = $('pbarFill');
const statusEl = $('status'), overlay = $('overlay'), card = $('card'), langBtn = $('lang'), sndBtn = $('snd');
const choiceBtns = [...predictEl.querySelectorAll('[data-choice]')];

FOODS.forEach((f, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'food'; b.dataset.id = f.id;
  b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${f.icon}</svg><span class="nm" data-i18n="${f.id}"></span><kbd>${i + 1}</kbd>`;
  b.addEventListener('click', () => startRun(f));
  foodsEl.appendChild(b);
});
choiceBtns.forEach(b => b.addEventListener('click', () => predict(b.dataset.choice)));

function updateHUD() {
  $('hScore').textContent = score;
  $('hRound').textContent = `${Math.min(round, ROUNDS)}/${ROUNDS}`;
  $('hBest').textContent = best;
  statusEl.textContent = state !== 'play' ? '' : run ? `${T('digesting')} · ${T(run.food.id)}` : T('ready');
  const busy = state !== 'play' || !!run;
  foodsEl.querySelectorAll('.food').forEach(b => b.disabled = busy);
}
function renderOverlay() {
  if (state === 'title') {
    card.innerHTML = `<div class="logo">${lang === 'ja' ? '消化<span>ラボ</span>' : 'DIGESTION<span>LAB</span>'}</div>
      <div class="dots"><i style="background:${C.blue}"></i><i style="background:${C.green}"></i><i style="background:${C.yellow}"></i></div>
      <p>${T('intro1')}<br>${T('intro2')}<br>${T('intro3')}</p>
      <button class="big" id="go" type="button">${T('start')}</button>`;
  } else if (state === 'results') {
    const rank = T('ranks')[score >= ROUNDS * 100 ? 2 : score >= ROUNDS * 60 ? 1 : 0];
    card.innerHTML = `<div class="logo" style="font-size:26px">${T('results')}</div>
      <div class="big-score">${score}</div><p>/ ${ROUNDS * 100}</p><p class="rank">${rank}</p>
      <button class="big" id="go" type="button">${T('again')}</button>`;
  }
  const go = $('go');
  if (go) go.addEventListener('click', startGame);
}
function applyLang() {
  document.documentElement.lang = lang;
  FONT = css('--font');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  choiceBtns.forEach(b => b.textContent = T(b.dataset.choice));
  if (presult.dataset.key) presult.textContent = T(presult.dataset.key);
  langBtn.setAttribute('aria-checked', String(lang === 'ja'));
  sndBtn.textContent = T(muted ? 'soundOff' : 'soundOn');
  renderOverlay(); updateHUD();
}
langBtn.addEventListener('click', () => {
  lang = lang === 'en' ? 'ja' : 'en';
  try { localStorage.setItem('digestionLab.lang', lang); } catch (e) {}
  applyLang();
});
sndBtn.addEventListener('click', () => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : .6;
  applyLang();
});

function startGame() {
  audio(); SFX.click();
  score = 0; round = 0; run = null; state = 'play';
  overlay.hidden = true; predictEl.hidden = true;
  updateHUD();
  foodsEl.querySelector('.food').focus();
}
function endGame() {
  state = 'results';
  if (score > best) { best = score; try { localStorage.setItem('digestionLab.best', best); } catch (e) {} }
  renderOverlay(); updateHUD();
  overlay.hidden = false;
}

function startRun(food) {
  if (state !== 'play' || run) return;
  const cat = food.cat;
  run = {
    food, cat, t0: performance.now() / 1000, t: 0, D: TRAVEL[cat],
    path: cat === 'fart' ? P_BEANS : P_TO_STOM,
    arrived: false, tr: 0, fired: false, tf: 0, predicted: null, rumbleAt: 0,
    parts: Array.from({ length: N_PART }, (_, i) => ({
      delay: i * STAGGER, j: (Math.random() - .5) * 5, r: 3 + Math.random() * 2,
      ox: (Math.random() - .5) * 56, oy: (Math.random() - .5) * 34, ph: Math.random() * 6.28, bubbled: false,
    })),
  };
  round++;
  presult.textContent = ''; presult.className = 'presult'; delete presult.dataset.key;
  choiceBtns.forEach(b => { b.disabled = false; b.classList.remove('picked'); });
  predictEl.hidden = false;
  SFX.gulp();
  if (cat === 'burp') setTimeout(() => run && run.cat === 'burp' && SFX.fizz(), TRAVEL.burp * 1000);
  updateHUD();
}
function showResult(key, ok) {
  presult.dataset.key = key; presult.textContent = T(key);
  presult.className = 'presult ' + (ok ? 'ok' : 'bad');
}
function predict(choice) {
  if (!run || run.predicted || run.arrived) return;
  run.predicted = choice;
  const ok = choice === run.cat;
  if (ok) score += 100;
  choiceBtns.forEach(b => { b.disabled = true; b.classList.toggle('picked', b.dataset.choice === choice); });
  showResult(ok ? 'correct' : 'wrong', ok);
  (ok ? SFX.ok : SFX.bad)();
  updateHUD();
}
function closePrediction() {
  choiceBtns.forEach(b => b.disabled = true);
  if (!run.predicted) { run.predicted = 'late'; showResult('late', false); SFX.bad(); }
}
function finishRun() {
  run = null;
  predictEl.hidden = true;
  updateHUD();
  if (round >= ROUNDS) setTimeout(endGame, 500);
}

// ---------- effects ----------
function burst(key, x, y, color, size, rot, dur) {
  fx.push({ key, x, y, color, size, rot, t0: performance.now() / 1000, dur, sub: run && run.predicted === run.cat ? '+100' : '+0' });
}
function shake(amp, dur) { shakeAmp = amp; shakeDur = shakeT = dur; }
function cssShake() { app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }

function fireBurp() {
  SFX.burp();
  burst('burpFx', 480, 120, C.blue, 60, .08, 1.6);
  for (let i = 0; i < 14; i++) {
    const a = (Math.random() - .5) * 1.2;
    puffs.push({ x: MOUTH.x + 4, y: MOUTH.y, vx: Math.cos(a) * (90 + Math.random() * 90), vy: Math.sin(a) * 90,
      r: 3, gr: 20 + Math.random() * 20, life: 1, max: 1, color: C.blue, ring: true });
  }
  bubbles.forEach(b => b.popping = true);
  shake(4, .3);
}
function fireFart() {
  SFX.fart();
  burst('fartFx', 165, 640, C.green, 72, -.1, 2);
  for (let i = 0; i < 46; i++) {
    const a = Math.PI * (.6 + Math.random() * .75);
    const sp = 60 + Math.random() * 190;
    puffs.push({ x: ANUS.x, y: ANUS.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .8,
      r: 4 + Math.random() * 6, gr: 18 + Math.random() * 30, life: 1.6, max: 1.6, color: C.green });
  }
  shake(14, .9); cssShake();
}
function fireSmooth() {
  SFX.chime();
  burst('smoothFx', 300, 270, C.yellow, 46, -.04, 1.8);
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 80;
    puffs.push({ x: STOM.cx, y: STOM.cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 2, gr: 0, life: 1, max: 1, color: C.yellow, star: true });
  }
}

// ---------- update ----------
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = (a, b, t) => { const k = clamp01((t - a) / (b - a)); return k * k * (3 - 2 * k); };
function stomachScale() {
  if (!run || run.cat !== 'burp' || !run.arrived) return 1;
  if (run.fired) return 1 + .3 * clamp01(1 - (run.t - run.tf) / .25);
  return 1 + .3 * clamp01((run.t - run.tr) / TIMEOUT.burp) + Math.sin(run.t * 30) * .01;
}

function update(dt) {
  if (run) {
    run.t = performance.now() / 1000 - run.t0;
    const t = run.t;
    if (!run.arrived) pbar.style.transform = `scaleX(${clamp01(1 - t / run.D)})`;
    if (!run.arrived && t >= run.D) { run.arrived = true; run.tr = t; closePrediction(); }

    if (run.cat === 'burp' && run.arrived) {
      if (!run.fired) {
        const s = stomachScale(), w = STOM.w * s, h = STOM.h * s;
        if (bubbles.length < 70 && Math.random() < dt * 40)
          bubbles.push({ x: STOM.cx + (Math.random() - .5) * (w - 12), y: STOM.cy + h / 2 - 6 - Math.random() * h * .3,
            r: 1, max: 5 + Math.random() * 12, gr: 40 + Math.random() * 50 });
        if (t >= run.tr + TIMEOUT.burp) { run.fired = true; run.tf = t; fireBurp(); }
      } else if (t >= run.tf + 1.6) finishRun();
    } else if (run.cat === 'fart' && run.arrived) {
      if (!run.fired) {
        if (t >= run.rumbleAt) { SFX.rumble(); run.rumbleAt = t + 1.1; shake(1.5, .4); }
        if (t >= run.tr + TIMEOUT.fart) { run.fired = true; run.tf = t; fireFart(); }
      } else if (t >= run.tf + 2.2) finishRun();
    } else if (run.cat === 'smooth') {
      const allGone = run.D + (N_PART - 1) * STAGGER + .9;
      if (!run.fired && t >= allGone) { run.fired = true; run.tf = t; fireSmooth(); }
      else if (run && run.fired && t >= run.tf + 1.8) finishRun();
    }
  }

  for (const b of bubbles) {
    if (b.popping) { b.r += 120 * dt; b.dead = b.r > b.max * 2.2; continue; }
    b.r += b.gr * dt; b.y -= 14 * dt;
    if (b.r >= b.max) { b.popping = true; b.max = b.r; }
  }
  bubbles = bubbles.filter(b => !b.dead);
  for (const p of puffs) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 1.6 * dt; p.vy *= 1 - 1.6 * dt; p.vy -= 10 * dt;
    p.r += p.gr * dt; p.life -= dt;
  }
  puffs = puffs.filter(p => p.life > 0);
  const now = performance.now() / 1000;
  fx = fx.filter(e => now - e.t0 < e.dur);
  shakeT = Math.max(0, shakeT - dt);
}

// ---------- draw ----------
function poly(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
}
function tube(path, color, w, glow = 0) {
  ctx.lineJoin = ctx.lineCap = 'round';
  if (glow) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 16 * glow; }
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(path.p2);
  if (glow) ctx.restore();
  ctx.strokeStyle = C.bg; ctx.lineWidth = w - 3; ctx.stroke(path.p2);
}
function flow(path, color, t, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.setLineDash([2, 12]); ctx.lineDashOffset = -t * 24;
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(path.p2); ctx.restore();
}
function label(key, x, y, tx, ty, align = 'left') {
  ctx.save();
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x + (align === 'left' ? -6 : 6), y - 4); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = C.muted; ctx.font = `600 12px ${FONT}`; ctx.textAlign = align;
  ctx.fillText(T(key), x, y);
  ctx.restore();
}
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; }

function drawBurst(e, now) {
  const k = (now - e.t0) / e.dur;
  const s = k < .14 ? Math.max(.01, easeOutBack(k / .14)) : 1 + .03 * Math.sin(now * 18);
  const alpha = k > .75 ? 1 - (k - .75) / .25 : 1;
  ctx.save();
  ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.scale(s, s); ctx.globalAlpha = alpha;
  ctx.font = `900 ${e.size}px ${FONT}`;
  const text = T(e.key), tw = ctx.measureText(text).width;
  const rx = tw / 2 + e.size * .75, ry = e.size * 1.15, spikes = 22;
  ctx.beginPath();
  for (let i = 0; i <= spikes * 2; i++) {
    const a = i / (spikes * 2) * Math.PI * 2, out = i % 2 === 0 ? 1.12 + .1 * Math.sin(i * 7.3) : .88;
    const px = Math.cos(a) * rx * out, py = Math.sin(a) * ry * out;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(11,15,23,.88)'; ctx.fill();
  ctx.strokeStyle = e.color; ctx.lineWidth = 3; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = C.bg; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = e.color; ctx.shadowColor = e.color; ctx.shadowBlur = 20; ctx.fillText(text, 0, 0);
  ctx.shadowBlur = 0; ctx.font = `800 ${e.size * .36}px ${FONT}`; ctx.fillStyle = C.ink;
  ctx.fillText(e.sub, 0, e.size * .68);
  ctx.restore();
}

function drawParticle(x, y, r, color, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function draw() {
  const now = performance.now() / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  const sk = shakeT > 0 ? shakeAmp * (shakeT / shakeDur) : 0;
  const sx = (Math.random() - .5) * 2 * sk, sy = (Math.random() - .5) * 2 * sk;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.translate(sx, sy);

  // grid
  ctx.strokeStyle = 'rgba(143,211,255,.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= VW; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, VH); }
  for (let y = 0; y <= VH; y += 40) { ctx.moveTo(0, y); ctx.lineTo(VW, y); }
  ctx.stroke();

  // body wireframe
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.strokeStyle = C.wire; ctx.globalAlpha = .75; ctx.lineWidth = 1.6;
  poly(BODY); ctx.stroke(); poly(BACK); ctx.stroke();
  ctx.globalAlpha = .25; ctx.setLineDash([4, 5]); poly(ARM); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = .6; ctx.fillStyle = C.wire;
  for (const p of BODY.concat(BACK)) ctx.fillRect(p[0] - 1.5, p[1] - 1.5, 3, 3);
  ctx.globalAlpha = .8;
  ctx.beginPath(); ctx.arc(370, 88, 3, 0, Math.PI * 2); ctx.stroke();           // eye
  ctx.beginPath(); ctx.arc(318, 112, 11, -1.2, 1.4); ctx.stroke();             // ear
  ctx.globalAlpha = 1;

  // cheek puff
  let puff = 0;
  if (run && run.cat === 'burp' && run.arrived) {
    puff = run.fired ? clamp01(1 - (run.t - run.tf) / .2) : smooth(run.tr + TIMEOUT.burp - .7, run.tr + TIMEOUT.burp, run.t);
  }
  ctx.save();
  ctx.strokeStyle = puff ? C.blue : C.wire; ctx.globalAlpha = puff ? 1 : .35; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(CHEEK.x + puff * 6, CHEEK.y, 7 + puff * 13, 6 + puff * 10, 0, 0, Math.PI * 2);
  if (puff) { ctx.fillStyle = 'rgba(63,180,255,.18)'; ctx.fill(); }
  ctx.stroke(); ctx.restore();

  // digestive tract
  const cat = run && run.cat;
  const gas = cat === 'fart' && run.arrived ? (run.fired ? clamp01(1 - (run.t - run.tf) / .6) : clamp01((run.t - run.tr) / TIMEOUT.fart)) : 0;
  tube(P_ESO, C.wire, 9);
  tube(P_SI, C.wire, 8);
  tube(P_COLON, gas ? C.green : C.wire, 10 + gas * 6, gas);
  if (cat === 'fart') {
    ctx.save(); ctx.setLineDash([6, 6]); ctx.lineDashOffset = -now * 30;
    ctx.strokeStyle = C.green; ctx.lineWidth = 2; ctx.shadowColor = C.green; ctx.shadowBlur = 10;
    ctx.stroke(P_BYPASS.p2); ctx.restore();
    label('express', 200, 345, 293, 355, 'right');
  }
  flow(P_ESO, C.wire, now, .25); flow(P_SI, C.wire, now, .18); flow(P_COLON, gas ? C.green : C.wire, now, .18 + gas * .5);

  // stomach
  const s = stomachScale(), sw = STOM.w * s, sh = STOM.h * s, sxx = STOM.cx - sw / 2, syy = STOM.cy - sh / 2;
  ctx.fillStyle = C.bg; ctx.fillRect(sxx, syy, sw, sh);
  if (cat === 'burp' && run.arrived) { ctx.fillStyle = `rgba(63,180,255,${.08 + .14 * (s - 1) / .3})`; ctx.fillRect(sxx, syy, sw, sh); }
  if (cat === 'smooth' && run.arrived) {
    const g = run.fired ? clamp01(1 - (run.t - run.tf)) : clamp01((run.t - run.D) / 1.5);
    ctx.fillStyle = `rgba(255,216,74,${.18 * g})`; ctx.fillRect(sxx, syy, sw, sh);
  }
  ctx.strokeStyle = cat === 'burp' && run.arrived ? C.blue : C.wire; ctx.lineWidth = 1.8;
  ctx.strokeRect(sxx, syy, sw, sh);
  ctx.globalAlpha = .35; ctx.strokeRect(sxx + 4, syy + 4, sw - 8, sh - 8); ctx.globalAlpha = 1;

  // bubbles (clipped to stomach)
  if (bubbles.length) {
    ctx.save(); ctx.beginPath(); ctx.rect(sxx, syy, sw, sh); ctx.clip();
    for (const b of bubbles) {
      const a = b.popping ? clamp01(1 - (b.r - b.max) / (b.max * 1.2)) : 1;
      ctx.globalAlpha = a; ctx.strokeStyle = C.blue; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      if (!b.popping) { ctx.fillStyle = 'rgba(63,180,255,.15)'; ctx.fill(); }
      ctx.stroke();
    }
    ctx.restore();
  }

  // labels
  label('eso', 452, 232, 333, 228);
  label('stomach', 452, 362, STOM.cx + sw / 2 + 2, 362);
  label('small', 452, 484, 395, 482);
  label('large', 452, 566, 412, 545);

  // food particles
  if (run) {
    const col = CAT_COLOR[run.cat], L = run.path.L;
    for (const p of run.parts) {
      const lt = run.t - p.delay;
      if (lt < 0) continue;
      const k = lt / run.D;
      if (k < 1) {
        for (let tr = 2; tr >= 0; tr--) {
          const q = at(run.path, k * L - tr * 7);
          drawParticle(q.x - Math.sin(q.a) * p.j, q.y + Math.cos(q.a) * p.j, p.r * (1 - tr * .22), col, tr ? .25 : 1);
        }
        continue;
      }
      const since = lt - run.D;
      if (run.cat === 'burp') {
        if (!p.bubbled) { p.bubbled = true; bubbles.push({ x: STOM.cx + p.ox * .6, y: STOM.cy + p.oy * .6, r: p.r, max: 8 + Math.random() * 10, gr: 70 }); }
        if (since < .25) drawParticle(STOM.cx + p.ox * .6, STOM.cy + p.oy * .6, p.r, col, 1 - since / .25);
      } else if (run.cat === 'smooth') {
        const q = since / .9;
        if (q >= 1) continue;
        const b = smooth(0, .3, since);
        const x = STOM.cx + p.ox * b + Math.cos(now * 2 + p.ph) * 4 * b, y = STOM.cy + p.oy * b + Math.sin(now * 2 + p.ph) * 3 * b;
        drawParticle(x, y, p.r * (1 - q * .8), col, 1 - q);
      } else if (!run.fired) {
        const end = at(run.path, L);
        drawParticle(end.x + p.ox * .2 + Math.sin(now * 9 + p.ph) * 1.5, end.y + p.oy * .25, p.r, col, .9);
      }
    }
    // gas build-up cloud

      ctx.save();
      for (let i = 0; i < 7; i++) {

        const r = 4 + gas * 13 + Math.sin(now * 6 + i) * 2;
        ctx.globalAlpha = .18 + gas * .2; ctx.fillStyle = C.green;
        ctx.beginPath(); ctx.arc(286 + Math.cos(a) * gas * 10, 595 + Math.sin(a) * gas * 8, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  // puffs
  for (const p of puffs) {
    const a = clamp01(p.life / p.max);
    ctx.globalAlpha = a;
    if (p.star) {
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(now * 4);
      ctx.fillRect(-4, -1, 8, 2); ctx.fillRect(-1, -4, 2, 8); ctx.restore();
    } else if (p.ring) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = p.color; ctx.globalAlpha = a * .28;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a * .6; ctx.strokeStyle = p.color; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  for (const e of fx) drawBurst(e, now);
}

// ---------- loop & input ----------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

document.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (state !== 'play') { if (k === 'enter' && !overlay.hidden && document.activeElement.id !== 'go') startGame(); return; }
  if (k >= '1' && k <= '6') startRun(FOODS[+k - 1]);
  else if (k === 'b') predict('burp');
  else if (k === 'f') predict('fart');
  else if (k === 's') predict('smooth');
});

resize(); applyLang();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
